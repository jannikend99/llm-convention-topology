protocol:
  N: 48
  H: 12
  string_length: 5
  W_emergence: 10
  W_cm: 2
  gate_threshold: 0.95
  gate_window: 144
  cap_phase1: 5000
  phase2_horizon: 1000
  rewards_mismatch: -50
  rewards_match: 100
  success_rule: payoff_gt_5
  retry_max_attempts: 3
  temperature: 0.5

network:
  topologies: [mixing, random_regular, lattice, watts_strogatz, barabasi_albert]
  degree: 4
  ws_k: 4
  ws_p: 0.1
  ba_m: 2
  require_connected: true

minority:
  k_set: [2, 4, 6, 8, 10, 12]
  mode: swap

pool:
  seed: 20260910

run:
  base_seed: 20260910
  seed_scheme_version: 1
  schema_version: 1
  prompt_template_version: v2-ashery-json-enum
  attempted_per_cell: 32
  sampling_plan: fixed_attempted
  checkpoint_every: 1
  campaign: experiment
  artifact_root: ""

jobs:
  models: [nemotron35_lightning, gemma4_31b, qwen38_27b, mistral_small32, olmo31_32b, glm4_32b]
  programs: [emergence, cm]

serve:
  provider: openai_compat
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  serve_wait_timeout: 600

models:
  nemotron35_lightning:
    model_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    revision: placeholder-revision
    shorthand: nemotron35_lightning
    thinking: false
    thinking_always_on: false
    reasoning_effort: null
    max_tokens: 512
    dtype: bfloat16
    quantization: null
    gpus: 2
    tp: 2
    max_model_len: 8192
    max_concurrent_runs: 4
    in_flight_limit: 8
    max_num_seqs: 16
    seed_indices_per_slice:
      emergence: 8
      cm: 4
    vllm_extra_args:
      - --enable-prefix-caching
      - --async-scheduling
      - --mamba-backend
      - flashinfer
      - --mamba-ssm-cache-dtype
      - float16
